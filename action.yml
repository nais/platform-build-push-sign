name: "GAR build/push/sign"
description: "Build, push, and sign (to Google Artifact Registry and optionally to GHCR)"
inputs:
  dockerfile:
    description: "Dockerfile path"
    default: "Dockerfile"
  name:
    description: "Name of image"
    required: true
  google_service_account:
    description: "Name of google service account to impersonate"
    required: false
  push:
    description: "Whether or not to push image"
    default: "true"
  push_ghcr:
    description: "Whether or not to push image to GHCR"
    default: "false"
  workload_identity_provider:
    description: "The workload identity provider for google service account impersonation"
    required: false
  registry:
    description: "The Google Artifact Registry path to push image to"
    default: "europe-north1-docker.pkg.dev/nais-io/nais/images"
  build_args:
    description: "List of build args"
    required: false
  build_secrets:
    description: "List of secrets"
    required: false
  sbom:
    description: "existing SBOM in cyclonedx format"
    default: "auto-generate-for-me-please.json"
  additional_sboms:
    description: "Newline-separated list of extra CycloneDX SBOM files to merge with the primary SBOM"
    required: false
    default: ""
  extra_tags:
    description: "A list of tags to be applied in addition to the detailed time+sha-tag and latest-tag"
    default: ""
  multi-platform:
    description: "Build multi-platform images, supporting amd64 and arm64"
    default: "false"
  context:
    description: "Docker build context"
    default: "."
  cache_from:
    description: "cache-from sent to docker/build-push-action"
    default: "type=gha"
  cache_to:
    description: "cache-to sent to docker/build-push-action"
    default: "type=gha,mode=max"
  target:
    description: "docker target"
    required: false
outputs:
  tag:
    description: "full image tag"
    value: ${{ steps.set_outputs.outputs.tag }}
  version:
    description: "version"
    value: ${{ steps.set_outputs.outputs.version }}
  image:
    description: "Canonical image reference"
    value: ${{ steps.set_outputs.outputs.image }}
  digest:
    description: "Image digest"
    value: ${{ steps.set_outputs.outputs.digest }}
runs:
  using: "composite"
  steps:
    - name: Check inputs
      shell: bash
      run: |
        if [ ! -d "${{ inputs.context }}" ]; then
          echo "::error ::Docker context not found: ${{ inputs.context }}."
          exit 1
        fi

        dockerfile="${{ inputs.dockerfile }}"
        if [ ! -f "$dockerfile" ]; then
          echo "::error ::Dockerfile not found: $dockerfile. Check the dockerfile input and context path."
          exit 1
        fi

        if [[ "${{ inputs.push }}" == "true" ]]; then
          if [[ "${{ inputs.workload_identity_provider }}" == "" ]]; then
            echo "Input workload_identity_provider is required when push is set to true."
            exit 1
          fi
          if [[ "${{ inputs.google_service_account }}" == "" ]]; then
            echo "Input google_service_account is required when push is set to true."
            exit 1
          fi
        fi
    - name: Set up QEMU
      if: "${{ inputs.multi-platform == 'true' }}"
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # ratchet:docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # ratchet:docker/setup-buildx-action@v4
    - id: "auth"
      name: "Authenticate to Google Cloud"
      if: ${{ inputs.push == 'true' }}
      uses: "google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093" # ratchet:google-github-actions/auth@v3
      with:
        workload_identity_provider: "${{ inputs.workload_identity_provider }}"
        service_account: "${{ inputs.google_service_account }}@nais-io.iam.gserviceaccount.com"
        token_format: "access_token"
    - name: "Login to registry"
      if: ${{ inputs.push == 'true' }}
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # ratchet:docker/login-action@v4
      with:
        registry: "${{ inputs.registry }}"
        username: "oauth2accesstoken"
        password: "${{ steps.auth.outputs.access_token }}"
    - name: "Login to GitHub Container Registry"
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # ratchet:docker/login-action@v4
      if: ${{ inputs.push_ghcr == 'true' }}
      with:
        registry: "ghcr.io"
        username: ${{ github.repository_owner }}
        password: ${{ github.token }}
    - name: "Docker metadata"
      id: "metadata"
      uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # ratchet:docker/metadata-action@v6
      with:
        images: |
          "${{ inputs.registry }}/${{ inputs.name }}"
          name=ghcr.io/${{ github.repository_owner }}/${{ inputs.name }},enable=${{ inputs.push_ghcr == 'true' }}
        tags: |
          type=raw,value={{date 'YYYY-MM-DD-HHmmss' tz='Europe/Oslo'}}-{{sha}}
          type=raw,value=latest
          type=raw,value=${{inputs.extra_tags}}

    - name: "Select platforms"
      id: multi_platform
      shell: bash
      run: |
        if [[ "${{ inputs.multi-platform }}" == 'true' ]]; then
          echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
        else
          echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
        fi
    - name: "Build and push"
      id: "build_push"
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # ratchet:docker/build-push-action@v7
      with:
        context: "${{ inputs.context }}"
        platforms: "${{ steps.multi_platform.outputs.platforms }}"
        file: "${{ inputs.dockerfile }}"
        push: ${{ inputs.push }}
        tags: ${{ steps.metadata.outputs.tags }}
        labels: ${{ steps.metadata.outputs.labels }}
        build-args: ${{ inputs.build_args }}
        secrets: ${{ inputs.build_secrets }}
        cache-from: ${{ inputs.cache_from }}
        cache-to: ${{ inputs.cache_to }}
        target: ${{ inputs.target }}
    - name: Build canonical image ref
      id: image_ref
      shell: bash
      env:
        IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        IMAGE_DIGEST: ${{ steps.build_push.outputs.digest }}
        PUSH_IMAGE: ${{ inputs.push }}
        PUSH_GHCR: ${{ inputs.push_ghcr }}
      run: |
        set -euo pipefail

        image="${IMAGE_TAGS%%$'\n'*}"
        digest="${IMAGE_DIGEST#@}"

        if [ -z "$image" ]; then
          echo "::error ::Failed to resolve image tag from docker metadata output. Expected steps.metadata.outputs.tags to contain at least one image tag."
          exit 1
        fi

        if [[ "$image" == *"@"* ]] && [ -n "$digest" ]; then
          echo "::error ::Image tag must not include a digest when digest is provided separately."
          exit 1
        fi

        if { [ "$PUSH_IMAGE" = 'true' ] || [ "$PUSH_GHCR" = 'true' ]; } && [ -z "$digest" ]; then
          echo "::error ::Failed to resolve image digest from docker build output. Digest is required when pushing and signing an image."
          exit 1
        fi

        image_ref="$image"

        if [ "$PUSH_IMAGE" = 'true' ] && [ -n "$digest" ]; then
          image_ref="$image@$digest"
        fi

        echo "tag=$image" >> "$GITHUB_OUTPUT"
        echo "image=$image_ref" >> "$GITHUB_OUTPUT"
    - name: Write summary
      shell: bash
      run: |
        echo '### tags' >> $GITHUB_STEP_SUMMARY
        echo '${{ steps.metadata.outputs.tags }}' >> $GITHUB_STEP_SUMMARY
    - name: "Generate SBOM, attest and sign image"
      if: ${{ inputs.push == 'true' }}
      uses: nais/attest-sign@v2 # ratchet:exclude
      with:
        image_ref: ${{ steps.image_ref.outputs.image }}
        sbom: ${{ inputs.sbom }}
        additional_sboms: ${{ inputs.additional_sboms }}
    - name: "Generate SBOM, attest and sign image (GHCR)"
      if: ${{ inputs.push_ghcr == 'true' }}
      uses: nais/attest-sign@v2 # ratchet:exclude
      with:
        image_ref: ghcr.io/${{ github.repository_owner }}/${{ inputs.name }}@${{ steps.build_push.outputs.digest }}
        sbom: ${{ inputs.sbom }}
        additional_sboms: ${{ inputs.additional_sboms }}
    - name: "Set outputs"
      id: set_outputs
      shell: bash
      env:
        TAG: ${{ steps.image_ref.outputs.tag }}
        VERSION: ${{ steps.metadata.outputs.version }}
        IMAGE: ${{ steps.image_ref.outputs.image }}
        DIGEST: ${{ steps.build_push.outputs.digest }}
      run: |
        set -euo pipefail

        if [ -z "$VERSION" ]; then
          echo "::error ::Failed to resolve image version from docker metadata output. Expected steps.metadata.outputs.version to be set."
          exit 1
        fi

        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
        echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
